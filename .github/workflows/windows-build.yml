name: Windows Candidate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # UTF-8 mode: the runner console defaults to cp1252, which can't encode the
  # ✓ glyphs some checks print.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: Build unsigned Windows candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-windows.txt

      - name: Install application and build dependencies
        run: python -m pip install -r requirements-windows.txt -e ".[dev]"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # build.py compiles the pinned whisper.cpp with the Vulkan backend (GPU
      # transcription); its shaders need the SDK's glslc. whisper.cpp publishes
      # no Vulkan build for Windows x64.
      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: "1.4.357.0"
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
          curl.exe -sSfL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed ($LASTEXITCODE)" }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" >> $env:GITHUB_ENV

      - name: Run Windows tests
        run: python -m pytest tests/ -q --tb=short -m "not ui and not slow and not network and not perf"

      - name: Run native Windows contract check
        run: python scripts/platform_smoke.py --expected windows

      - name: Build app bundle + installer
        run: python packaging/windows/build.py --require-installer

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-CheckedProcess {
            param([string]$FilePath, [string[]]$Arguments, [int]$TimeoutMs = 120000)
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit($TimeoutMs)) {
              $process.Kill($true)
              throw "Timed out after ${TimeoutMs}ms: $FilePath $Arguments"
            }
            if ($process.ExitCode -ne 0) {
              throw "Process failed with exit code $($process.ExitCode): $FilePath $Arguments"
            }
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'Wayfinder Aura smoke'
          $installers = @(Get-ChildItem 'dist/installer/WayfinderAura-Setup-*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)"
          }
          Invoke-CheckedProcess -FilePath $installers[0].FullName -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`""
          ) -TimeoutMs 300000

          $app = Join-Path $installDir 'Wayfinder Aura.exe'
          try {
            foreach ($probe in @('--app-import-self-test', '--tls-self-test', '--llm-engine-self-test',
                                 '--audio-processing-self-test')) {
              Invoke-CheckedProcess -FilePath $app -Arguments @($probe)
            }
            # Both bundled whisper.cpp engines (CPU, and Vulkan for GPU mode) must be
            # present and launchable; the runner has no GPU, so the Vulkan build's
            # backend loads without devices and --help still exits 0.
            foreach ($dir in @('whisper', 'whisper-vulkan')) {
              foreach ($tool in @('whisper-cli.exe', 'whisper-server.exe')) {
                $toolPath = Join-Path $installDir "_internal\$dir\$tool"
                if (-not (Test-Path -LiteralPath $toolPath)) { throw "Bundle is missing $dir\$tool" }
              }
              Invoke-CheckedProcess -FilePath (Join-Path $installDir "_internal\$dir\whisper-cli.exe") -Arguments @('--help')
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installDir '_internal\whisper-vulkan\ggml-vulkan.dll'))) {
              throw 'Bundle is missing whisper-vulkan\ggml-vulkan.dll'
            }
          } finally {
            Invoke-CheckedProcess -FilePath (Join-Path $installDir 'unins000.exe') -Arguments @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            ) -TimeoutMs 300000
            # unins000.exe relaunches itself from %TEMP% and exits immediately,
            # so poll for the removal instead of checking once.
            $deadline = (Get-Date).AddMinutes(2)
            while ((Test-Path -LiteralPath $app) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
            }
            if (Test-Path -LiteralPath $app) {
              throw "Uninstall left the application executable behind: $app"
            }
          }

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: wayfinder-aura-windows-x64
          path: dist/installer/WayfinderAura-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
