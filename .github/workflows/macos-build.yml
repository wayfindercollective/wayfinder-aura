name: macOS Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  BUILD_JOBS: "2"

jobs:
  build:
    name: Build unsigned macOS candidate
    runs-on: [self-hosted, macOS, ARM64, aura-macos]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Verify provisioned macOS Python and create isolated environment
        run: bash scripts/ci/prepare-macos-python.sh

      - name: Enforce self-hosted runner policy
        run: python scripts/ci/check-runner-policy.py

      - name: Install application and build dependencies
        run: python -m pip install -c packaging/macos/constraints.txt -e '.[dev]'

      - name: Run macOS tests
        run: python -m pytest tests/ -q --tb=short -m "not ui and not slow and not network and not perf"

      - name: Run native macOS contract check
        run: python scripts/platform_smoke.py --expected darwin

      - name: Build and verify app + DMG
        run: python packaging/macos/build.py

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: wayfinder-aura-macos-${{ runner.arch }}
          path: dist/Wayfinder_Aura-*-macOS-*.dmg
          retention-days: 7
