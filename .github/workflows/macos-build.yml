name: macOS Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"

jobs:
  build:
    name: Build unsigned macOS candidate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/macos/constraints.txt

      - name: Install application and build dependencies
        run: python -m pip install -c packaging/macos/constraints.txt -e '.[dev]'

      - name: Run macOS tests
        run: python -m pytest tests/ -q --tb=short -m "not ui and not slow and not network and not perf"

      - name: Run native macOS contract check
        run: python scripts/platform_smoke.py --expected darwin

      - name: Build and verify app + DMG
        run: python packaging/macos/build.py

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: wayfinder-aura-macos-${{ runner.arch }}
          path: dist/Wayfinder_Aura-*-macOS-*.dmg
          retention-days: 7
