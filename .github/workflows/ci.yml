name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: aura-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # python3-tk / portaudio: app deps
          # libegl1 + GL stack: PyQt6 QtGui imports (overlay tests) need libEGL.so.1
          sudo apt-get install -y python3-tk portaudio19-dev \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install -e . \
            pytest pytest-cov pytest-mock pytest-timeout ruff

      - name: Run high-signal Ruff checks
        run: |
          # The repo predates a formatting baseline, so CI currently gates the
          # runtime-breaking classes that must never ship. A full style ratchet
          # should come in a dedicated formatting-only change.
          ruff check --output-format=github --select F821,F823,F722,E9 .

      - name: Verify project structure
        run: python scripts/verify_structure.py

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short --cov=src/wayfinder --cov-report=xml -m "not ui and not slow and not network and not perf"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  platform-smoke:
    name: Platform smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            expected: darwin
          - name: Windows
            os: windows-latest
            expected: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Aura
        run: python -m pip install -e .

      - name: Verify native platform boundaries
        run: python scripts/platform_smoke.py --expected ${{ matrix.expected }}

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    # UTF-8 mode: the console defaults to cp1252 on Windows runners, which can't
    # encode the ✓ glyphs the structure check and some tests print.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Aura + test tools
        run: python -m pip install -e . pytest pytest-mock pytest-timeout ruff

      - name: Run high-signal Ruff checks
        run: ruff check --output-format=github --select F821,F823,F722,E9 .

      - name: Verify project structure
        run: python scripts/verify_structure.py

      - name: Verify native platform boundaries
        run: python scripts/platform_smoke.py --expected windows

      - name: Run tests (Linux-only tests auto-skip via the linux_only marker)
        run: pytest tests/ -q --tb=short -m "not ui and not slow and not network and not perf"
