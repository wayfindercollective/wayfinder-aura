name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Validation scope (release and PR checks always include native platforms)"
        type: choice
        options: [all, linux]
        default: all
  workflow_call:

concurrency:
  group: aura-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  BUILD_JOBS: "2"
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, aura-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Create isolated Python environment
        run: python scripts/ci/prepare-python.py

      - name: Install Python dependencies
        run: |
          python -m pip install -e . \
            pytest pytest-cov pytest-mock pytest-timeout ruff

      - name: Enforce self-hosted runner policy
        run: python scripts/ci/check-runner-policy.py

      - name: Run high-signal Ruff checks
        run: |
          # The repo predates a formatting baseline, so CI currently gates the
          # runtime-breaking classes that must never ship. A full style ratchet
          # should come in a dedicated formatting-only change.
          ruff check --output-format=github --select F821,F823,F722,E9 .

      - name: Verify project structure
        run: python scripts/verify_structure.py

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short --basetemp=/tmp/aci --cov=src/wayfinder --cov-report=xml -m "not ui and not slow and not network and not perf"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  platform-smoke:
    name: Platform smoke (macOS)
    if: (github.event_name != 'workflow_dispatch' || inputs.platforms != 'linux') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, aura-macos]
    timeout-minutes: 45
    env:
      # Match the native candidate's tested Python/Tk and dependency stack.
      PYTHON_VERSION: "3.12.10"
    steps:
      - uses: actions/checkout@v7

      - name: Verify provisioned macOS Python and create isolated environment
        run: bash scripts/ci/prepare-macos-python.sh

      - name: Install Aura + test tools
        run: python -m pip install -c packaging/macos/constraints.txt -e . pytest pytest-mock pytest-timeout

      - name: Verify native platform boundaries
        run: python scripts/platform_smoke.py --expected darwin

      - name: Run macOS tests
        run: python -m pytest tests/ -q --tb=short -m "not ui and not slow and not network and not perf"

  windows-tests:
    name: Windows tests
    if: (github.event_name != 'workflow_dispatch' || inputs.platforms != 'linux') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, aura-windows]
    timeout-minutes: 45
    # UTF-8 mode: the console defaults to cp1252 on Windows runners, which can't
    # encode the ✓ glyphs the structure check and some tests print.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Create isolated Python environment
        run: python scripts/ci/prepare-python.py

      - name: Install Aura + test tools
        run: python -m pip install -e . pytest pytest-mock pytest-timeout ruff

      - name: Run high-signal Ruff checks
        run: ruff check --output-format=github --select F821,F823,F722,E9 .

      - name: Verify project structure
        run: python scripts/verify_structure.py

      - name: Verify native platform boundaries
        run: python scripts/platform_smoke.py --expected windows

      - name: Run tests (Linux-only tests auto-skip via the linux_only marker)
        run: pytest tests/ -q --tb=short -m "not ui and not slow and not network and not perf"
